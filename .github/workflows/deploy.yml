name: deploy
# A fake deploy: what Argo CD would sync for an Application in argocd/, the
# artefact it follows unpacked and printed. It touches no cluster.
on:
  workflow_dispatch:
    inputs:
      application:
        description: demo, the latest release; or topic, a pull request's preview
        type: choice
        options: [demo, topic]
        default: demo
      branch:
        description: For topic, the root's branch of the pull request
        type: string
permissions:
  contents: read
  packages: read
  pull-requests: read
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The same kustomize as the render.
  KUSTOMIZE_VERSION: 5.7.1
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: imjasonh/setup-crane@v0.7
      - run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv$KUSTOMIZE_VERSION/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" |
            sudo tar -xz -C /usr/local/bin kustomize
      - env:
          APPLICATION: ${{ inputs.application }}
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$APPLICATION" = topic ]; then
            [ -n "$BRANCH" ] || { echo "::error::topic needs a branch"; exit 1; }
            ./argocd/sync.sh topic "$BRANCH"
          else
            ./argocd/sync.sh demo
          fi
