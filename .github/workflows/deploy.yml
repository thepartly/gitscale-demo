name: deploy
# A fake deploy: what Argo CD would sync for an Application in argocd/, the
# artefact it follows unpacked and printed. It touches no cluster.
#
# Run from the default branch, it is the demo, the latest release; from a
# release's tag, the demo at that release; from any other branch, that
# topic's preview, the pull request from the branch.
on: workflow_dispatch
permissions:
  contents: read
  packages: read
  pull-requests: read
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The same kustomize as the render.
  KUSTOMIZE_VERSION: 5.7.1
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: imjasonh/setup-crane@v0.7
      - run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv$KUSTOMIZE_VERSION/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" |
            sudo tar -xz -C /usr/local/bin kustomize
      - env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ./argocd/sync.sh demo "$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            ./argocd/sync.sh demo
          else
            ./argocd/sync.sh topic "$GITHUB_REF_NAME"
          fi
